# 매일 아침 GitHub 서버에서 광역버스 잔여 좌석을 수집해 data/ 폴더에 저장합니다.
# 노트북을 켜 둘 필요가 없습니다.
#  - 인증키: 저장소 Settings → Secrets and variables → Actions 에 SERVICE_KEY 로 등록
#  - 수동 실행: Actions 탭 → collect-bus-seats → Run workflow
#    ('quick_test' 를 체크하면 시간과 상관없이 한 번만 조회해 보고 끝냄 — 연결 확인용)
name: collect-bus-seats

on:
  # GitHub 예약 실행은 서버가 붐비면 몇 시간씩 늦게 시작되기도 함 (10/7: 05:40 예약 → 09:07 시작).
  # 그래서 여러 번 예약해 두고, 가장 먼저 시작된 실행이 06:00까지 기다렸다가 10:00까지 수집.
  # 동시에 하나만 돌기 때문에(concurrency) 나머지는 10시 이후에 시작해 바로 끝남.
  schedule:
    - cron: "10 19 * * *"   # 04:10 (한국 시간)
    - cron: "10 20 * * *"   # 05:10
    - cron: "40 20 * * *"   # 05:40
    - cron: "10 21 * * *"   # 06:10
    - cron: "10 22 * * *"   # 07:10
  workflow_dispatch:         # Actions 탭에서 직접 실행
    inputs:
      quick_test:
        description: "한 번만 조회해 보고 끝내기 (연결 확인용, 데이터 저장 안 함)"
        type: boolean
        default: true

permissions:
  contents: write            # 수집한 데이터를 저장소에 커밋하기 위해 필요

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # 04:10에 시작하면 06:00까지 대기 + 10:00까지 수집 (GitHub 한도 6시간)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests

      - name: 인증키 파일 만들기 (Secrets 에서)
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then echo "SERVICE_KEY 시크릿이 없습니다"; exit 1; fi
          echo "SERVICE_KEY = \"$SERVICE_KEY\"" > api_key.py

      - name: 연결 확인 (한 번만 조회)
        if: ${{ inputs.quick_test }}
        run: |
          python -c "import collect; collect.collect_once(collect.now_kst())"
          # 버스를 한 대도 못 받았으면 실패로 표시 (해외 접속 차단 · 키 오류 등)
          if [ ! -s bus_seats.csv ] || [ "$(wc -l < bus_seats.csv)" -lt 2 ]; then
            echo "::error::버스 데이터를 받지 못했습니다 — 공공데이터포털 접속 또는 인증키를 확인하세요"; exit 1
          fi
          echo "받은 기록: $(( $(wc -l < bus_seats.csv) - 1 ))줄"

      - name: 수집 (한국 시간 06:00~10:00, 1분 간격)
        if: ${{ !inputs.quick_test }}
        run: python collect.py --once-today

      - name: 데이터 저장 (data/bus_seats_날짜.csv)
        if: ${{ !inputs.quick_test }}
        run: |
          if [ ! -f bus_seats.csv ]; then echo "오늘 수집된 데이터 없음"; exit 0; fi
          day=$(TZ=Asia/Seoul date +%F)
          f="data/bus_seats_${day}.csv"
          mkdir -p data
          git pull --rebase   # 같은 날 앞선 실행이 저장한 파일이 있으면 받아서
          if [ -f "$f" ]; then tail -n +2 bus_seats.csv >> "$f"; rm bus_seats.csv   # 이어 붙임 (덮어쓰지 않음)
          else mv bus_seats.csv "$f"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: ${day} 수집 ($(wc -l < "$f")줄)"
          git pull --rebase
          git push
