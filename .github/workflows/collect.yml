# 첫차(05:00)부터 막차 도착(다음 날 01:30)까지 GitHub 서버에서 광역버스 잔여 좌석을 수집해
# data/ 폴더에 운행일별로 저장합니다. 노트북을 켜 둘 필요가 없습니다.
#
# GitHub 실행은 한 번에 최대 6시간이라 '이어달리기'로 수집합니다.
#  - 실행 한 번은 340분(5시간 40분) 수집하고 저장한 뒤 끝남
#  - 매시간 예약해 두고 동시에 하나만 돌게 해서(concurrency), 끝나면 대기 중인 다음 실행이 바로 이어받음
#  - 예약 실행이 늦게 시작돼도(10/7: 3시간 지연) 대기 중인 실행이 있어 빈틈이 거의 없음
#
#  - 인증키: 저장소 Settings → Secrets and variables → Actions 에 SERVICE_KEY 로 등록
#  - 수동 실행: Actions 탭 → collect-bus-seats → Run workflow
#    ('quick_test' 를 체크하면 시간과 상관없이 한 번만 조회해 보고 끝냄 — 연결 확인용)
name: collect-bus-seats

on:
  schedule:
    - cron: "0 * * * *"     # 매시간 정각 (다음 수집 실행을 대기열에 올려 둠)
  workflow_dispatch:
    inputs:
      quick_test:
        description: "한 번만 조회해 보고 끝내기 (연결 확인용, 데이터 저장 안 함)"
        type: boolean
        default: true

permissions:
  contents: write            # 수집한 데이터를 저장소에 커밋하기 위해 필요

concurrency:
  group: collect
  cancel-in-progress: false  # 돌고 있는 수집은 끊지 않고, 다음 실행은 끝날 때까지 대기

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # 340분 수집 + 준비·저장 (GitHub 한도 6시간)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests

      - name: 인증키 파일 만들기 (Secrets 에서)
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then echo "SERVICE_KEY 시크릿이 없습니다"; exit 1; fi
          echo "SERVICE_KEY = \"$SERVICE_KEY\"" > api_key.py

      - name: 연결 확인 (한 번만 조회)
        if: ${{ inputs.quick_test }}
        run: |
          python -c "import collect; collect.collect_once(collect.now_kst())"
          # 버스를 한 대도 못 받았으면 실패로 표시 (해외 접속 차단 · 키 오류 등)
          if [ ! -s bus_seats.csv ] || [ "$(wc -l < bus_seats.csv)" -lt 2 ]; then
            echo "::error::버스 데이터를 받지 못했습니다 — 공공데이터포털 접속 또는 인증키를 확인하세요"; exit 1
          fi
          echo "받은 기록: $(( $(wc -l < bus_seats.csv) - 1 ))줄"

      - name: 수집 (최대 340분, 운행 시간 05:00~01:30만)
        if: ${{ !inputs.quick_test }}
        run: python collect.py --max-minutes 340

      - name: 데이터 저장 (data/bus_seats_운행일.csv 에 이어 붙임)
        if: ${{ always() && !inputs.quick_test }}   # 수집 중 오류가 나도 모은 만큼은 저장
        run: |
          if [ ! -f bus_seats.csv ]; then echo "이번 실행에서 수집된 데이터 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase                # 앞선 실행이 저장한 파일을 받은 뒤
          python save_data.py              # 운행일별 파일에 이어 붙임
          git add data
          git commit -m "data: $(TZ=Asia/Seoul date '+%m/%d %H:%M') 까지 수집" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
