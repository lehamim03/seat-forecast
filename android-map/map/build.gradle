plugins { id 'com.android.library' }

android {
    namespace 'kr.ac.kookmin.seatforecast.map'
    compileSdk 35
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.kakao.maps.open:android:2.15.2'
    // 팀 앱 다른 화면(A · B)과 같은 Material 3 버튼 · 칩
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// 지도 예시만 라이브러리 assets에 포함해 저장소의 원본 GeoJSON을 그대로 사용한다.
abstract class PrepareMapExample extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getExamples()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copyExample() {
        examples.files.each { source ->
            java.nio.file.Files.copy(source.toPath(),
                    outputDir.file(source.name).get().asFile.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def mapAssets = tasks.register("prepare${variant.name.capitalize()}MapExample", PrepareMapExample) {
        examples.from(['map.geojson', 'route_choices.json', 'recommendations.json'].collect {
            rootProject.layout.projectDirectory.file("../docs/examples/$it")
        })
    }
    variant.sources.assets.addGeneratedSourceDirectory(mapAssets) { it.outputDir }
}
