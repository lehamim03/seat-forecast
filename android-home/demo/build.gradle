plugins {
    id 'com.android.application'
}

def local = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }

android {
    namespace 'kr.ac.kookmin.seatforecast.homedemo'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.ac.kookmin.seatforecast.homedemo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        // 예측 서버 주소 (server.py) — 환경 변수 또는 local.properties 의 SERVER_BASE_URL, 없으면 에뮬레이터에서 내 컴퓨터(10.0.2.2)
        buildConfigField 'String', 'SERVER_BASE_URL', '"' + providers.environmentVariable('SERVER_BASE_URL')
                .getOrElse(local.getProperty('SERVER_BASE_URL', 'http://10.0.2.2:8000/')) + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':home')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
