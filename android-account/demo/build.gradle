plugins {
    id 'com.android.application'
}

// demo/google-services.json 이 있으면 실제 Firebase 프로젝트, 없으면 로컬 Firebase 에뮬레이터 사용
def hasGoogleServices = file('google-services.json').exists()
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'kr.ac.kookmin.seatforecast.accountdemo'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.ac.kookmin.seatforecast.accountdemo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        buildConfigField 'boolean', 'USE_FIREBASE_EMULATOR', String.valueOf(!hasGoogleServices)
        // 예측 서버 주소 (에뮬레이터에서 10.0.2.2 = 내 컴퓨터)
        buildConfigField 'String', 'SERVER_BASE_URL', '"http://10.0.2.2:8000/"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':account')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
