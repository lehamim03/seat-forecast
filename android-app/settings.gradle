// 팀 앱 — A 홈 · B 실시간 대안 · C 지도 · D 로그인 · 마이를 하나의 앱으로 묶어 실행합니다.
// 각 담당 모듈은 원래 폴더 그대로 가져옵니다 (모듈 코드는 고치지 않음).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // C 지도: 카카오맵 SDK
        maven {
            url = uri("https://devrepo.kakao.com/nexus/repository/kakaomap-releases/")
            content { includeGroup("com.kakao.maps.open") }
        }
    }
}

rootProject.name = "seat-forecast-app"
include ':app'

include ':home'           // A 홈 — 정류장 · 버스 추천
project(':home').projectDir = file('../android-home/home')
include ':alternatives'   // B 실시간 대안
project(':alternatives').projectDir = file('../android-alternatives/alternatives')
include ':map'            // C 지도
project(':map').projectDir = file('../android-map/map')
include ':account'        // D 로그인 · 마이페이지 · 탑승 피드백
project(':account').projectDir = file('../android-account/account')
// E 돌발 알림: 서버 쪽(week13_fcm_sender.py)만 있음 — D 의 last_trip 기준으로 FCM 전송
